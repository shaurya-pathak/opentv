name: Build

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    env:
      LAB_SIGNING_AVAILABLE: ${{ secrets.OPENTV_LAB_KEYSTORE != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Sign Lab APK with persistent development key
        if: env.LAB_SIGNING_AVAILABLE == 'true'
        env:
          LAB_KEYSTORE_BASE64: ${{ secrets.OPENTV_LAB_KEYSTORE }}
          LAB_KEYSTORE_PASSWORD: ${{ secrets.OPENTV_LAB_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$LAB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opentv-lab.jks"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$RUNNER_TEMP/opentv-lab.jks" --ks-key-alias opentv-lab \
            --ks-pass env:LAB_KEYSTORE_PASSWORD --key-pass env:LAB_KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/opentv-lab.apk" app/build/outputs/apk/debug/app-debug.apk
          "$signer" verify --verbose "$RUNNER_TEMP/opentv-lab.apk"
          mv "$RUNNER_TEMP/opentv-lab.apk" app/build/outputs/apk/debug/app-debug.apk
          rm -f "$RUNNER_TEMP/opentv-lab.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opentv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
